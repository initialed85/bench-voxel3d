[package]
name = "voxel-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Bevy's derive macros resolve their paths from the crate's own Cargo.toml, so
# bevy must be a top-level dependency (not only a target-specific one).
[dependencies]
voxel-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
bevy = { version = "0.19.1", default-features = false, features = [
    "3d_api",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_light",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "async_executor",
    "reflect_auto_register",
    "std",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "Node",
    "NodeList",
    "WebSocket",
    "Window",
    "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "x11",
    "wayland",
    "multi_threaded",
    "custom_cursor",
    "bevy_gilrs",
    "bevy_clipboard",
    "bevy_input_focus",
    "bevy_image",
    "bevy_shader",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_animation",
    "bevy_camera_controller",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "morph",
] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tungstenite = "0.30"
