# The voxel bench: wasm client (voxel-client) and a native server (voxel-server).
# scripts/build.sh expects wasm-bindgen on PATH, so it is installed into a cached volume first.
steps:
  - name: check
    image: docker.io/library/rust:1.97.1
    # The namespace LimitRange gives an unmarked step 1 Gi (default 1Gi in
    # clusters/dev/applications/woodpecker/limits.yaml) and this step OOMs inside it: bench-flightsim
    # pipeline 2 died with exit 137 and "received oom kill" partway through `Compiling bevy_reflect`.
    # The server crate uses bevy_ecs too, so even a wasm-only repo pays the full bevy graph here.
    # Two CPUs as well as 8 Gi: rustc sizes its job count from available_parallelism, which reads the
    # cgroup, so the old 1 CPU default was not the ceiling on parallelism that it looked like. 4 Gi,
    # the previous LimitRange max, was still not enough (pipeline 3 OOMed compiling bevy_pbr), so the
    # ceiling moved to 8 Gi and the step asks for it.
    environment:
      # Debuginfo is the dominant memory cost of a Bevy dev build and cargo test uses the dev profile;
      # turning it off is the single biggest lever on peak RSS here and it halves the build time.
      # Backtraces in test failures lose line detail, which is the trade being made.
      CARGO_PROFILE_DEV_DEBUG: "0"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 8Gi
    commands:
      - rustc --version
      - rustup target add wasm32-unknown-unknown
      # wasm-bindgen-cli is not a rustup component and `cargo install` of it costs ~12 minutes, so CI
      # fetches the prebuilt musl tarball into tools/ exactly like bench-asteroids' build.sh does. The
      # version has to match the wasm-bindgen crate in Cargo.lock (0.2.129) or the glue generation
      # fails with a version mismatch.
      - mkdir -p tools
      - if [ ! -x tools/wasm-bindgen ]; then curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz" -o tools/wb.tar.gz && tar -xzf tools/wb.tar.gz -C tools --strip-components=1 && rm tools/wb.tar.gz; fi
      - PATH="$PWD/tools:$PATH"
      - cargo fmt --check
      # the client is a wasm target: host-compiling it drags bevy/winit to wayland-client, which the
      # rust image has no headers for (measured: "The file `wayland-client.pc` needs to be installed
      # and the PKG_CONFIG_PATH environment variable must contain its parent directory"). scripts/build.sh
      # below compiles the client for wasm32 properly, which is the check that means something.
      - cargo test --workspace --exclude voxel-client
      - PATH="$PWD/tools:$PATH" scripts/build.sh
      # scripts/build.sh only builds the wasm client, unlike bench-asteroids' build.sh which builds
      # both halves, so the server had never been compiled in release here at all. It is the thing that
      # actually runs, so build it rather than assert on a path nothing produces (pipeline 5 failed with
      # "ls: cannot access 'target/release/voxel-server'").
      - cargo build --release -p voxel-server
      - ls -l web/voxel_client_bg.wasm target/release/voxel-server

when:
  - event: push
    branch: master
  - event: pull_request
